name: element-skin-union-gateway

services:
  gateway:
    image: element-skin-union-gateway:${GATEWAY_VERSION:-0.1.0}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8267:8267"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./secrets:/app/secrets:ro
      - gateway-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  gateway-data:
